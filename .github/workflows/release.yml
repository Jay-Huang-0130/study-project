name: Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -ne 'tag' -or '${{ github.ref_name }}' -ne "v$version") {
            throw 'Choose a vX.Y.Z tag matching package.json.'
          }
      - run: npm ci
      - run: npm run check
      - name: Package installer and portable app
        run: node node_modules/electron-builder/cli.js --win nsis portable --publish never
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: 1
      - name: Prepare download and checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item -LiteralPath "release/Study-Project-$version-Windows.exe" -Destination release/Study-Project-Windows.exe
          Copy-Item -LiteralPath "release/Study-Project-Setup-$version.exe" -Destination release/Study-Project-Setup.exe
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.blockmap' -or $_.Name -eq 'latest.yml' }
          $assets | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
      - name: Save build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Study-Project-Windows
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --draft --title "Study Project $tag" --notes-file docs/RELEASE-NOTES.md --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release.' }
          }
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.blockmap' -or $_.Name -in 'latest.yml','SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release.' }
